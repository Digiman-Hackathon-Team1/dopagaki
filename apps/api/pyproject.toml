[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi[standard]>=0.165.0",
    "langchain-anthropic>=1.7.13",
    "langgraph>=1.2.24",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
